name: Attested plan review v3

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  plan-review:
    if: "!github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    environment: PATCHFORGE_REVIEW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review harness dependency
        run: python -m pip install "pydantic>=2.10.0"
      - name: Classify plan snapshot without checking out the pull request
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          reason=
          if ! test "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" = "1" \
            || ! test "$(git rev-list --parents -n 1 "$HEAD_SHA" | wc -w)" = "2" \
            || ! test "$(git rev-parse "$HEAD_SHA^")" = "$BASE_SHA" \
            || ! test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = ".patchforge/review-plan.json"; then
            reason=plan_transition_invalid
          elif ! git show "$HEAD_SHA:.patchforge/review-plan.json" > review-plan.json; then
            reason=declaration_absent
          elif ! PYTHONPATH=src python -c 'from pathlib import Path; from orchestrator.review_evidence import PlanScopeDeclaration; PlanScopeDeclaration.model_validate_json(Path("review-plan.json").read_text(encoding="utf-8"))'; then
            reason=declaration_invalid
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Materialize and attest v3 record
        id: materialize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          args=(--phase plan_review --output review-record.json --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --pr-number "$PR_NUMBER" --github-output "$GITHUB_OUTPUT")
          if test -n "$REASON"; then args+=(--admission-reason "$REASON"); else args+=(--packet review-plan.json --plan-head-sha "$HEAD_SHA" --tier economy); fi
          PYTHONPATH=src python .github/scripts/review_runner.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.materialize.outputs.artifact_name }}
          path: review-record.json
          retention-days: 30
      - uses: actions/attest@v4
        with:
          subject-path: review-record.json
