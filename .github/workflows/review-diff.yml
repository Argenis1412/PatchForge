name: Attested diff review v3

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  diff-review:
    if: "!github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    environment: PATCHFORGE_REVIEW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review harness dependency
        run: python -m pip install "pydantic>=2.10.0"
      - name: Classify linear diff snapshot without checking out the pull request
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          mapfile -t commits < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          plan_sha="${commits[0]:-}"
          reason=
          if test -z "$plan_sha" || ! test "$(git rev-list --parents -n 1 "$plan_sha" | wc -w)" = "2" || ! test "$(git rev-parse "$plan_sha^")" = "$BASE_SHA" || ! test "$(git diff --name-only "$BASE_SHA" "$plan_sha")" = ".patchforge/review-plan.json"; then reason=plan_transition_invalid; fi
          if test -z "$reason" && test "$HEAD_SHA" = "$plan_sha"; then reason=implementation_chain_invalid; fi
          if test -z "$reason"; then
            expected="$plan_sha"; for commit in "${commits[@]:1}"; do if ! test "$(git rev-list --parents -n 1 "$commit" | wc -w)" = "2" || ! test "$(git rev-parse "$commit^")" = "$expected"; then reason=implementation_chain_invalid; break; fi; expected="$commit"; done
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"; echo "plan_sha=$plan_sha" >> "$GITHUB_OUTPUT"
      - name: Materialize canonical v3 packet and record
        id: materialize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_SHA: ${{ steps.classify.outputs.plan_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          args=(--phase diff_review --output review-record.json --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --pr-number "$PR_NUMBER" --github-output "$GITHUB_OUTPUT")
          if test -n "$REASON"; then args+=(--admission-reason "$REASON"); else PYTHONPATH=src python .github/scripts/review_packet.py --plan-head-sha "$PLAN_SHA" --head-sha "$HEAD_SHA" --output packet.json; args+=(--packet packet.json --plan-head-sha "$PLAN_SHA" --tier economy); fi
          PYTHONPATH=src python .github/scripts/review_runner.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.materialize.outputs.artifact_name }}
          path: review-record.json
          retention-days: 30
      - uses: actions/attest@v4
        with:
          subject-path: review-record.json
