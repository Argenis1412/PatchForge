name: Attested diff review

on:
  pull_request_target:
    types: [synchronize, ready_for_review]

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  diff-review:
    if: "!github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    environment: PATCHFORGE_REVIEW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Detect a plan-review candidate
        id: eligibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          if ! git cat-file -e "$HEAD_SHA:.patchforge/review-plan.json"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$HEAD_SHA:.patchforge/review-plan.json" > review-plan.json
          PLAN_SHA="$(jq -r '.plan_head_sha' review-plan.json)"
          if ! test "$(jq -r '.base_sha' review-plan.json)" = "$BASE_SHA" \
            || ! test "$(git rev-list --count "$BASE_SHA..$PLAN_SHA")" = "1" \
            || ! test "$(git rev-list --parents -n 1 "$PLAN_SHA" | wc -w)" = "2" \
            || ! test "$(git rev-parse "$PLAN_SHA^")" = "$BASE_SHA" \
            || ! test "$(git diff --name-only "$BASE_SHA" "$PLAN_SHA")" = ".patchforge/review-plan.json"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Require a linear implementation chain from an admitted plan
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$HEAD_SHA:.patchforge/review-plan.json" > review-plan.json
          PLAN_SHA="$(jq -r '.plan_head_sha' review-plan.json)"
          test "$(jq -r '.base_sha' review-plan.json)" = "$BASE_SHA"
          git merge-base --is-ancestor "$PLAN_SHA" "$HEAD_SHA"
          for commit in $(git rev-list --reverse "$PLAN_SHA..$HEAD_SHA"); do
            test "$(git rev-list --parents -n 1 "$commit" | wc -w)" = "2"
          done
          echo "PLAN_SHA=$PLAN_SHA" >> "$GITHUB_ENV"
      - name: Review canonical diff without tools
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p review-evidence
          git diff --binary "$PLAN_SHA" "$HEAD_SHA" > actual.diff
          python -c 'import json, pathlib; pathlib.Path("review-evidence/packet.json").write_text(json.dumps({"diff": pathlib.Path("actual.diff").read_text(encoding="utf-8")}), encoding="utf-8")'
          changed_files="$(git diff --name-only "$PLAN_SHA" "$HEAD_SHA" | wc -l)"
          changed_lines="$(git diff --numstat "$PLAN_SHA" "$HEAD_SHA" | awk '{ if ($1 == "-" || $2 == "-") { print 101; exit } sum += $1 + $2 } END { print sum + 0 }')"
          if [ "$changed_files" -gt 2 ] || [ "$changed_lines" -gt 100 ]; then TIER=high_assurance; else TIER=economy; fi
          PYTHONPATH=src python .github/scripts/review_runner.py \
            --phase diff_review --packet review-evidence/packet.json \
            --output review-evidence/review-record.json --base-sha "$BASE_SHA" \
            --plan-head-sha "$PLAN_SHA" --head-sha "$HEAD_SHA" --tier "$TIER"
      - uses: actions/upload-artifact@v4
        if: steps.eligibility.outputs.eligible == 'true'
        with:
          name: review-evidence-diff_review-${{ github.event.pull_request.number }}
          path: review-evidence/review-record.json
          retention-days: 30
      - uses: actions/attest@v4
        if: steps.eligibility.outputs.eligible == 'true'
        with:
          subject-path: review-evidence/review-record.json
