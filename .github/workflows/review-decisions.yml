name: Attested review decisions

on:
  workflow_dispatch:
    inputs:
      decision:
        required: true
        type: choice
        options: [override, resolution]
      record_id:
        required: true
      subject_digest:
        required: true
      rationale:
        required: true

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  decision:
    if: github.actor == 'Argenis1412'
    runs-on: ubuntu-latest
    environment: PATCHFORGE_REVIEW
    steps:
      - name: Emit a decision linked to one exact reviewed subject
        env:
          INPUTS_JSON: ${{ toJson(inputs) }}
        run: |
          mkdir -p review-decision
          printf '%s\n' "$INPUTS_JSON" > review-decision/decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: review-decision-${{ inputs.record_id }}
          path: review-decision/decision.json
          retention-days: 30
      - uses: actions/attest@v4
        with:
          subject-path: review-decision/decision.json
