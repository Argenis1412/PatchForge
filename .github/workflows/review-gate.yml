name: Independent review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify current attested review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git show "$HEAD_SHA:.patchforge/review-plan.json" > review-plan.json
          PLAN_SHA="$(jq -r '.plan_head_sha' review-plan.json)"
          git diff --binary "$PLAN_SHA" "$HEAD_SHA" > actual.diff
          python -c 'import json, pathlib; pathlib.Path("diff-packet.json").write_text(json.dumps({"diff": pathlib.Path("actual.diff").read_text(encoding="utf-8")}), encoding="utf-8")'
          PYTHONPATH=src python .github/scripts/verify_review_evidence.py \
            --repo "$REPOSITORY" --pr "$PR" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --plan-packet review-plan.json --diff-packet diff-packet.json
